[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-open-predictor"
version = "0.1.0"
description = "Leakage-safe ATP/WTA US Open match and detailed-stat predictor"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
us-open = "us_open_model.cli:main"

[tool.setuptools.packages.find]
include = ["us_open_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

